[project]
name = "aroll-autocut"
version = "0.1.0"
description = "Generate SRT subtitles from audio and video with sherpa-onnx."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "av>=14.0.0",
    "numpy>=2.0.0",
    "sherpa-onnx>=1.13.2",
    "sherpa-onnx-core==1.13.2",
]

[project.scripts]
aroll-autocut = "aroll_autocut.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aroll_autocut"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: tests that load local ASR/VAD models",
]

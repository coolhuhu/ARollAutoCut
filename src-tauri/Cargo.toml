[package]
name = "arollcut"
version = "0.1.0"
description = "Edit spoken-word media by editing its transcript."
authors = ["coolhuhu"]
edition = "2021"

[lib]
name = "arollcut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
bzip2 = "0.4.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = "1.13.2"
tar = "0.4.46"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2.7.1"
tempfile = "3"

[dev-dependencies]
